spring.application.name=VetTurno

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vetturno
spring.datasource.username=vetturno_user
spring.datasource.password=tu_contraseña_aquí
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.esteban.vetturno=DEBUG
