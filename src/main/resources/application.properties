spring.application.name=VetTurno

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vetturno
spring.datasource.username=vetturno_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET:defaultSecretKeyChangeThisInProductionWithEnvironmentVariable12345}
app.jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.DEVSenior.vetturno=DEBUG
